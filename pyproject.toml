[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-organizer-agent"
version = "0.1.0"
description = "Meeting Organizer Agent implementing Lab 1 (Agent Loop) and Lab 2 (Tool-Using Agent)"
authors = [{ name = "Meeting Organizer Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
